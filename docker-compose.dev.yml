version: '3.8'

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: whatsapp-api-dev
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=development
      - PORT=3000
      - DB_HOST=mysql
      - DB_PORT=3306
      - DB_NAME=whatsapp_api
      - DB_USER=root
      - DB_PASSWORD=rootpassword
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - REDIS_ENABLED=true
      - JWT_SECRET=dev-jwt-secret-key-change-in-production
      - JWT_REFRESH_SECRET=dev-refresh-secret-key-change-in-production
      - JWT_EXPIRES_IN=24h
      - APP_URL=http://localhost:3000
      - API_VERSION=v1
    volumes:
      - .:/app
      - /app/node_modules
      - ./sessions:/app/sessions
      - ./logs:/app/logs
    depends_on:
      - mysql
      - redis
    networks:
      - whatsapp-dev-network
    command: npm run dev

  mysql:
    image: mysql:8.0
    container_name: whatsapp-mysql-dev
    restart: unless-stopped
    environment:
      - MYSQL_ROOT_PASSWORD=rootpassword
      - MYSQL_DATABASE=whatsapp_api
    ports:
      - "3306:3306"
    volumes:
      - mysql_dev_data:/var/lib/mysql
    networks:
      - whatsapp-dev-network

  redis:
    image: redis:7-alpine
    container_name: whatsapp-redis-dev
    restart: unless-stopped
    ports:
      - "6379:6379"
    networks:
      - whatsapp-dev-network

  # phpMyAdmin for database management
  phpmyadmin:
    image: phpmyadmin:latest
    container_name: whatsapp-phpmyadmin
    restart: unless-stopped
    ports:
      - "8080:80"
    environment:
      - PMA_HOST=mysql
      - PMA_USER=root
      - PMA_PASSWORD=rootpassword
    depends_on:
      - mysql
    networks:
      - whatsapp-dev-network

volumes:
  mysql_dev_data:
    driver: local

networks:
  whatsapp-dev-network:
    driver: bridge
